<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelaporan Kerusakan - PT Arunika Teknologi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #1d4ed8;
      color: #fff;
      text-align: center;
      padding: 24px 16px;
    }
    header h1 { margin: 0 0 4px; }
    header p { margin: 0; opacity: .9; }
    main { max-width: 520px; margin: 24px auto; padding: 0 16px; }
    form {
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #1d4ed8;
      color: #fff;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #hasil { margin-top: 16px; padding: 0; border-radius: 6px; }
    #hasil.ok { padding: 14px; background: #dcfce7; color: #166534; }
    #hasil.gagal { padding: 14px; background: #fee2e2; color: #991b1b; }
    footer { text-align: center; padding: 20px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>PT Arunika Teknologi</h1>
    <p>Sistem Pelaporan Kerusakan Fasilitas</p>
  </header>

  <main>
    <form id="form-laporan">
      <label for="nama">Nama Pelapor</label>
      <input type="text" id="nama" placeholder="Contoh: Andi" required>

      <label for="lokasi">Lokasi / Ruangan</label>
      <input type="text" id="lokasi" placeholder="Contoh: Ruang Administrasi" required>

      <label for="deskripsi">Deskripsi Kerusakan</label>
      <textarea id="deskripsi" rows="4" placeholder="Contoh: Komputer tidak dapat menyala" required></textarea>

      <button type="submit" id="tombol">Kirim Laporan</button>
    </form>

    <div id="hasil" role="status"></div>
  </main>

  <footer>&copy; PT Arunika Teknologi</footer>

  <script>
    const API_URL = "https://3vr7g5m2re.execute-api.us-east-1.amazonaws.com/permintaan";

    const form = document.getElementById("form-laporan");
    const hasil = document.getElementById("hasil");
    const tombol = document.getElementById("tombol");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      tombol.disabled = true;
      tombol.textContent = "Mengirim...";
      hasil.className = "";
      hasil.textContent = "";

      const payload = {
        nama: document.getElementById("nama").value,
        lokasi: document.getElementById("lokasi").value,
        deskripsi: document.getElementById("deskripsi").value,
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
          hasil.className = "ok";
          hasil.textContent = "Laporan diterima. Nomor tiket Anda: " + data.tiket;
          form.reset();
        } else {
          hasil.className = "gagal";
          hasil.textContent = "Gagal: " + (data.error || data.pesan || "terjadi kesalahan");
        }
      } catch (err) {
        hasil.className = "gagal";
        hasil.textContent = "Tidak dapat terhubung ke server.";
      } finally {
        tombol.disabled = false;
        tombol.textContent = "Kirim Laporan";
      }
    });
  </script>
</body>
</html>
