<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelaporan Kerusakan - PT Arunika Teknologi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PT Arunika Teknologi</h1>
    <p>Sistem Pelaporan Kerusakan Fasilitas</p>
  </header>

  <main>
    <form id="form-laporan">
      <label for="nama">Nama Pelapor</label>
      <input type="text" id="nama" placeholder="Contoh: Andi" required>

      <label for="lokasi">Lokasi / Ruangan</label>
      <input type="text" id="lokasi" placeholder="Contoh: Ruang Administrasi" required>

      <label for="deskripsi">Deskripsi Kerusakan</label>
      <textarea id="deskripsi" rows="4" placeholder="Contoh: Komputer tidak dapat menyala" required></textarea>

      <button type="submit" id="tombol">Kirim Laporan</button>
    </form>

    <div id="hasil" role="status"></div>
  </main>

  <footer>&copy; PT Arunika Teknologi</footer>
  <script src="script.js"></script>
</body>
</html>
